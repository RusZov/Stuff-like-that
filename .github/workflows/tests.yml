name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q dota_coach tests
      - name: Validate Windows HWND capture backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -e ".[capture]"
          python -c "from windows_capture import WindowsCapture; import inspect; assert 'window_hwnd' in inspect.signature(WindowsCapture).parameters"
      - name: Validate live Valve/OpenDota sources
        if: runner.os == 'Linux'
        run: python -m dota_coach.cli --health
