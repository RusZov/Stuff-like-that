name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile package
        run: python -m compileall -q dota_coach tests
      - name: Validate Windows HWND capture backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install -e ".[capture]"
          python -c "from windows_capture import WindowsCapture; import inspect; assert 'window_hwnd' in inspect.signature(WindowsCapture).parameters"
      - name: Validate live Valve/OpenDota sources
        if: runner.os == 'Linux'
        run: python -m dota_coach.cli --health
      - name: Live recommendation smoke test
        if: runner.os == 'Linux'
        run: |
          python -c "from dota_coach.data import DotaData; from dota_coach.engine import recommend; d=DotaData(); d.refresh(); picks=recommend(d, [], [], '2', limit=5, rank_tier='legend'); assert len(picks)==5; assert len({p.hero for p in picks})==5; assert all(picks[i].score >= picks[i+1].score for i in range(len(picks)-1)); print([(p.hero, p.score, p.confidence) for p in picks])"
