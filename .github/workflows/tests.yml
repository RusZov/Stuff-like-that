name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Validate live Dota data sources
        if: runner.os == 'Linux'
        run: python api_probe.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py dota_data.py data_provider.py engine.py vision.py api_probe.py
      - name: Headless GUI smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from app import Coach; app=QApplication([]); w=Coach(); assert 'Dota 2 Coach' in w.windowTitle(); assert len(w.data.heroes) >= 127; print('GUI smoke test OK')"
      - name: GUI construction smoke test (Windows)
        if: runner.os == 'Windows'
        run: python -c "from PySide6.QtWidgets import QApplication; from app import Coach; app=QApplication([]); w=Coach(); assert 'Dota 2 Coach' in w.windowTitle(); assert len(w.data.heroes) >= 127; print('Windows GUI smoke test OK')"
