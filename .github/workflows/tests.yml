name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile app.py dota_data.py engine.py vision.py
      - name: Headless GUI smoke test
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from app import Coach
          app = QApplication([])
          window = Coach()
          assert "Dota 2 Coach" in window.windowTitle()
          assert len(window.data.heroes) >= 127
          print("GUI smoke test OK")
          PY
